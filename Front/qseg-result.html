<script type="text/javascript">
function base64ToBlob(base64, contentType) {
  // Supprimer l'en-tête si présent
  const base64Data = base64.split(',').pop();  // enlève tout avant la virgule

  const byteCharacters = atob(base64Data);
  const byteArrays = [];

  for (let offset = 0; offset < byteCharacters.length; offset += 512) {
    const slice = byteCharacters.slice(offset, offset + 512);
    const byteNumbers = new Array(slice.length);
    for (let i = 0; i < slice.length; i++) {
      byteNumbers[i] = slice.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    byteArrays.push(byteArray);
  }

  return new Blob(byteArrays, { type: contentType });
}

  function selectImageFromLocalStorage() {
    const base64Data = localStorage.getItem('uploadedTiff');
    const fileName = localStorage.getItem('uploadedFileName') || 'image.tiff';

    if (!base64Data) {
      alert("Aucune image trouvée dans le localStorage.");
      return;
    }

    // Mise à jour du nom du fichier dans la page
    document.getElementById('fileName').textContent = `File: ${fileName}`;

    // Conversion base64 → Blob
    const blob = base64ToBlob(base64Data, 'image/tiff');
    const formData = new FormData();
    formData.append('file', blob, fileName);

    // Envoi au serveur
    $.ajax({
      url: '/upload',
      type: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      success: function(response) {
        if (response.image_data) {
          const processedImageData = "data:image/png;base64," + response.image_data;

          // Affichage dans le canvas (par exemple)
          const canvas = document.getElementById('canvas');
          const ctx = canvas.getContext('2d');
          const img = new Image();
          img.onload = function () {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
          };
          img.src = processedImageData;
        } else {
          alert("Erreur : " + response.error);
        }
      },
      error: function() {
        alert("Erreur lors du traitement de l'image");
      }
    });
  }


  function processImageFromLocalStorage() {
    const base64 = localStorage.getItem('uploadedTiff');
    const fileName = localStorage.getItem('uploadedFileName');

    if (!base64 || !fileName) {
        alert("Aucun fichier trouvé dans le stockage local.");
        return;
    }

    const contentTypeMatch = base64.match(/^data:(.*);base64,/);
    const contentType = contentTypeMatch ? contentTypeMatch[1] : 'image/tiff';

    const blob = base64ToBlob(base64, contentType);
    const formData = new FormData();
    formData.append('file', blob, fileName);

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert("Erreur d'upload : " + data.error);
            return;
        }

        const imagePath = data.image_path;

        const processData = new FormData();
        processData.append('image_path', imagePath);
        processData.append('image_height', '512');
        processData.append('image_width', '512');
        processData.append('water_penalty', '0.75');
        processData.append('no_water_penalty', '-0.75');
        processData.append('sigma', '0.2');
        processData.append('mu', '1');
        processData.append('k', '2');

        fetch('/process', {
            method: 'POST',
            body: processData
        })
        .then(response => response.json())
        .then(result => {
            if (result.error) {
                alert("Erreur de traitement : " + result.error);
                return;
            }

            const segmentedImg = 'data:image/png;base64,' + result.image_data;
            const imgEl = document.querySelector('.image3-1');
            if (imgEl) {
                imgEl.src = segmentedImg;
            }
        })
        .catch(error => {
            console.error('Erreur lors du traitement :', error);
        });
    })
    .catch(error => {
        console.error('Erreur lors de l\'upload :', error);
    });
}
  // Appel automatique au chargement de la page
  window.onload = selectImageFromLocalStorage;
</script>
