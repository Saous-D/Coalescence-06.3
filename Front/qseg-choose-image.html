    <script>

        let imagePath = "";

        document.getElementById("chooseImageBtn").addEventListener("click", function() {
          document.getElementById("imagePopup").style.display = "block";
        });

        function closePopup() {
            document.getElementById("imagePopup").style.display = "none";
        }

        function selectImage(selectedPath) {
            imagePath = selectedPath;
            console.log("Chemin de l'image sélectionnée :", imagePath);

            closePopup();
        }

        let image_height = 520;
        let image_width = 520;
        let water_penalty = 0.75;
        let no_water_penalty = -0.75;
        let sigma = 0.2;
        let mu = 1;
        let k = 2;

        $(document).ready(function() {
            var socket = io();

             // Handle real-time messages from the server
             socket.on('messages', function(data) {
                $('#statusMessages').empty(); // Clear previous messages
                $('#statusMessages').text(data.data); // Add the new message
            });

            $("#run inter-semi-bold-black-17px").click(function() {
                if (imagePath === "") {
                    alert("Please choose an image first");
                    return;
                }

                $("#loading").show();
                $('#statusMessages').empty(); // Clear previous messages

                var formData = new FormData();
                formData.append('image_path', imagePath);
                formData.append('image_height', image_height); // localStorage.getItem('image_height'));
                formData.append('image_width', image_width);//localStorage.getItem('image_width'));
                formData.append('water_penalty', water_penalty);//localStorage.getItem('water_penalty'));
                formData.append('no_water_penalty', no_water_penalty);//localStorage.getItem('no_water_penalty'));
                formData.append('sigma', sigma);//localStorage.getItem('sigma'));
                formData.append('mu', mu);//localStorage.getItem('mu'));
                formData.append('k', k);//localStorage.getItem('k'));
                $.ajax({
                    url: '/process',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        $("#loading").hide();
                        $('#statusMessages').empty(); // Clear previous messages when processing is done

                        if (response.image_data) {
                            var processedImageData = "data:image/png;base64," + response.image_data;
                            $("#resultImage").attr("src", processedImageData).show();
                            $("#downloadButton").attr("href", processedImageData).show();
                        } else {
                            alert("Error processing image");
                        }
                    },
                    error: function(response) {
                        $("#loading").hide();
                        $('#statusMessages').empty(); // Clear previous messages on error
                        alert("An error occurred while processing the image");
                    }
                });
            });
        });

  </script>
