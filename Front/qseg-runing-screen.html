<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--<meta name=description content="This site was generated with Anima. www.animaapp.com"/>-->
    <!-- <link rel="shortcut icon" type=image/png href="https://animaproject.s3.amazonaws.com/home/favicon.png" /> -->
    <meta name="viewport" content="width=1094, maximum-scale=1.0" />
    <link rel="shortcut icon" type="image/png" href="https://animaproject.s3.amazonaws.com/home/favicon.png" />
    <meta name="og:type" content="website" />
    <meta name="twitter:card" content="photo" />
    <link rel="stylesheet" type="text/css" href="/static/css/qseg-runing-screen.css" />
    <link rel="stylesheet" type="text/css" href="/static/css/styleguide.css" />
    <link rel="stylesheet" type="text/css" href="/static/css/globals.css" />
  </head>
  <body style="margin: 0; background: #0e172b">
    <input type="hidden" id="anPageName" name="page" value="qseg-runing-screen" />
    <div class="container-center-horizontal">
      <div class="qseg-runing-screen screen">
        <div class="side">
          <div class="overlap-group">
            <div class="rectangle-10 rectangle"></div>
            <div class="side-bar">
              <img class="mask-group" src="/static/images/mask-group@2x.png" alt="Mask group" />
              <a href="{{ url_for('qapps')}}">
                <div class="group-43 group">
                  <img class="app-2" src="/static/images/app-2-1@2x.png" alt="app 2" />
                  <div class="q-apps q inter-bold-white-18px">Q-Apps</div>
                </div></a
              >
              <div class="flex-row flex">
                <img class="usine-2" src="/static/images/usine-2-1@2x.png" alt="usine 2" />
                <div class="by-industry inter-bold-white-18px">By industry</div>
              </div>
              <a href="{{ url_for('dashboard')}}">
                <div class="group-44 group">
                  <img class="rapport-danalyse-2" src="/static/images/rapport-danalyse-2-1@2x.png" alt="rapport-danalyse 2" />
                  <div class="dashboard">Dashboard</div>
                </div></a
              >
            </div>
            <div class="text-3 text jejumyeongjo-regular-normal-white-20px">&gt;</div>
            <img class="rectangle-8 rectangle" src="/static/images/rectangle-8.svg" alt="Rectangle 8" />
            <div class="q-seg q inter-bold-spring-green-12px">Q-SCAN</div>
            <div class="q-road q inter-normal-white-12px">Q-ROAD</div>
            <div class="q-sched q inter-normal-white-12px">Q-SCHED</div>
            <div class="q-pgm q inter-normal-white-12px">Q-PGM</div>
            <div class="q-color q inter-normal-white-12px">Q-COLOR</div>
            <div class="q-medoids q inter-normal-white-12px">Q-MEDOIDS</div>
          </div>
        </div>
        <div class="flex-col flex">
          <header class="header">
            <div class="overlap-group1">
              <div class="overlap-group-1">
                <img class="loupe-arrondie-1" src="/static/images/loupe-arrondie-1@2x.png" alt="loupe-arrondie 1" />
                <div class="find-q-apps-or-industry inter-normal-pumice-12px">Find Q-apps or industry</div>
              </div>
              <div class="flex-col-1">
                <div class="flex-row-1">
                  <img class="mask-group-1" src="/static/images/mask-group-1@2x.png" alt="Mask group" />
                  <img class="question-1" src="/static/images/question-1@2x.png" alt="question 1" />
                </div>
                <div class="overlap-group2 inter-normal-white-12px">
                  <div class="account">Account</div>
                  <div class="help">Help</div>
                </div>
              </div>
            </div>
          </header>
          <div class="overlap-group3">
            <div class="q-seg-is-running valign-text-middle">Q-SCAN IS RUNNING...</div>
            <img class="mask-group-2" src="/static/images/mask-group-15@2x.png" alt="Mask group" />
            <img class="mask-group-3" src="/static/images/mask-group-16@2x.png" alt="Mask group" />
            <p class="text-4 text inter-bold-white-20px">.&nbsp;&nbsp;.&nbsp;&nbsp;.&nbsp;&nbsp;.&nbsp;&nbsp;.</p>
            <p class="text-5 text inter-bold-white-20px">.&nbsp;&nbsp;.&nbsp;&nbsp;.&nbsp;&nbsp;.&nbsp;&nbsp;.</p>
            <a href="{{ url_for('qseg_result')}}">
              <div class="group-30 group">
                <div class="overlap-group-2">
                    <div style="
    position: absolute;
    inset: 0;
    margin: auto;
    z-index: 0;
    border-radius: 25px;
    background: linear-gradient(to left, #03FE9C, 40%, #3A64FA);
    height: 40px;   
    width: 140px;
    pointer-events: none;
  "></div>

                  <div class="processingseg valign-text-middle" style="z-index: 1; margin-top: 10px;">processing...</div></div>
              </div></a
            ><img class="vector" src="/static/images/vector-9.svg" alt="Vector" />
            <img class="mask-group-4" src="/static/images/mask-group-17@2x.png" alt="Mask group" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
