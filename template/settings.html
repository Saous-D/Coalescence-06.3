<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <h1>Settings</h1>
    <form id="settingsForm">
        <label for="imageHeight">Image Height:</label>
        <input type="number" id="imageHeight" name="image_height" value="512" required>
        <br>
        <label for="imageWidth">Image Width:</label>
        <input type="number" id="imageWidth" name="image_width" value="512" required>
        <br>
        <label for="waterPenalty">Water Penalty:</label>
        <input type="number" step="0.01" id="waterPenalty" name="water_penalty" value="0.75" required>
        <br>
        <label for="noWaterPenalty">No Water Penalty:</label>
        <input type="number" step="0.01" id="noWaterPenalty" name="no_water_penalty" value="-0.75" required>
        <br>
        <label for="sigma">Sigma:</label>
        <input type="number" step="0.01" id="sigma" name="sigma" value="0.3" required>
        <br>
        <label for="mu">Mu:</label>
        <input type="number" id="mu" name="mu" value="1" required>
        <br>
        <button type="submit">Save Settings</button>
    </form>
    <br>
    <button onclick="window.location.href='/'">Back to Main</button>
    <script>
        document.getElementById('settingsForm').onsubmit = function(event) {
            event.preventDefault();
            var form = event.target;
            localStorage.setItem('image_height', form.image_height.value);
            localStorage.setItem('image_width', form.image_width.value);
            localStorage.setItem('water_penalty', form.water_penalty.value);
            localStorage.setItem('no_water_penalty', form.no_water_penalty.value);
            localStorage.setItem('sigma', form.sigma.value);
            localStorage.setItem('mu', form.mu.value);
            alert('Settings saved!');
        };
    </script>
</body>
</html>
